[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oped"
version = "0.1.0"
description = "Trim anime OP/ED from episodes"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "numpy", "av>=12", "pysubs2", "platformdirs"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[dependency-groups]
dev = ["pytest", "pytest-qt"]

[project.scripts]
oped = "oped.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
